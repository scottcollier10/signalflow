name: Bug Report
description: Report a bug in SignalFlow
labels: [bug]
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: Which part of the system is affected?
      placeholder: "backend / frontend / analysis / import / visualizer"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages if applicable.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this?
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, browser
      placeholder: "macOS 15, Python 3.13, Node 20, Chrome 130"
